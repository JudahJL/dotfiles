[dock]
auto_hide = true
cross_axis_padding = 4
enabled = true
icon_size = 24
item_spacing = 3
main_axis_padding = 8
margin_edge = 4
radius = 8
reserve_space = false

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-3" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 957.0
    output = "DP-3"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

[shell]
font_family = "Iosevka NF"
password_style = "random"
polkit_agent = true
settings_show_advanced = true

    [shell.screenshot]
    directory = "~/Pictures/screenshots"

[system.monitor]
gpu_poll_seconds = 5

[theme]
builtin = "Noctalia"
community_palette = "Gruber Darker"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "~/.local/share/wallpapers"

    [wallpaper.automation]
    enabled = true
    interval_seconds = 600
    order = "alphabetical"

    [wallpaper.default]
    path = "~/.local/share/wallpapers/wallhaven_7327pv.jpg"

    [wallpaper.last]
    path = "~/.local/share/wallpapers/wallhaven_7327pv.jpg"

    [wallpaper.monitors.DP-3]
    path = "~/.local/share/wallpapers/wallhaven_7327pv.jpg"

[widget.audio_visualizer]
show_when_idle = true

[widget.session]
capsule = true

[widget.spacer_2]
type = "spacer"
