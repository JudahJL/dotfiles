[bar.default]
center = [ "clock", "active_window", "audio_visualizer", "spacer_2", "group:g1" ]

    [[bar.default.capsule_group]]
    fill = "surface_variant"
    id = "g1"
    members = [ "cpu", "ram", "temp" ]
    opacity = 1.0
    padding = 6.0

