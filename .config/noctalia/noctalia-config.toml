[bar.default]
center = [ "clock", "group:g1", "audio_visualizer" ]
start = [ "launcher", "wallpaper", "wallhaven", "workspaces", "screenshot" ]

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_container"
    id = "g1"
    members = [ "cpu", "ram", "gpu", "sysmon", "temp" ]
    opacity = 1.0
    padding = 6.0

[dock]
cross_axis_padding = 4
enabled = true
icon_size = 24
item_spacing = 3
main_axis_padding = 8

[location]
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget.lockscreen-login-box]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 926.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget.lockscreen-login-box.settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."noctalia/wallhaven"]
download_dir = "~/Pictures/wallpapers"

[plugins]
enabled = [ "noctalia/wallhaven" ]

[shell]
font_family = "Iosevka NF"
polkit_agent = true

    [shell.screenshot]
    directory = "~/Pictures/screenshots"

[theme]
builtin = "Gruvbox"
community_palette = "Gruber Darker"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "~/Pictures/wallpapers"

    [wallpaper.automation]
    enabled = true
    interval_seconds = 600
    order = "alphabetical"

[widget.audio_visualizer]
show_when_idle = true

[widget.sysmon]
stat = "gpu_usage"

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"
